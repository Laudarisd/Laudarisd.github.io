<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="Manrope, Arial, sans-serif" role="img" aria-label="Agent workflow diagram with planner, tools and memory">
  <rect width="400" height="200" fill="url(#ground)"/>
<defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6f7"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#284b52" flood-opacity="0.16"/></filter>
    <filter id="bs" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#284b52" flood-opacity="0.22"/></filter>
  </defs>

  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284b52"/></marker></defs>
  <rect x="22" y="80" width="70" height="36" rx="6" fill="#ffffff" stroke="#284b52" stroke-width="1.5" filter="url(#sh)"/><text x="57.0" y="95" font-size="9" font-weight="700" fill="#284b52" text-anchor="middle" >User</text><text x="57.0" y="107" font-size="7" font-weight="500" fill="#8a9aa0" text-anchor="middle" >task request</text>
  <rect x="122" y="80" width="76" height="36" rx="6" fill="#e8eff0" stroke="#284b52" stroke-width="1.5" filter="url(#sh)"/><text x="160.0" y="95" font-size="9" font-weight="700" fill="#284b52" text-anchor="middle" >Planner</text><text x="160.0" y="107" font-size="7" font-weight="500" fill="#8a9aa0" text-anchor="middle" >LLM</text>
  <rect x="232" y="24" width="76" height="36" rx="6" fill="#ffffff" stroke="#284b52" stroke-width="1.5" filter="url(#sh)"/><text x="270.0" y="39" font-size="9" font-weight="700" fill="#284b52" text-anchor="middle" >Web search</text><text x="270.0" y="51" font-size="7" font-weight="500" fill="#8a9aa0" text-anchor="middle" >tool</text>
  <rect x="232" y="80" width="76" height="36" rx="6" fill="#ffffff" stroke="#284b52" stroke-width="1.5" filter="url(#sh)"/><text x="270.0" y="95" font-size="9" font-weight="700" fill="#284b52" text-anchor="middle" >Code exec</text><text x="270.0" y="107" font-size="7" font-weight="500" fill="#8a9aa0" text-anchor="middle" >tool</text>
  <rect x="232" y="136" width="76" height="36" rx="6" fill="#ffffff" stroke="#284b52" stroke-width="1.5" filter="url(#sh)"/><text x="270.0" y="151" font-size="9" font-weight="700" fill="#284b52" text-anchor="middle" >Memory</text><text x="270.0" y="163" font-size="7" font-weight="500" fill="#8a9aa0" text-anchor="middle" >vector store</text>
  <rect x="336" y="80" width="54" height="36" rx="6" fill="#e8eff0" stroke="#284b52" stroke-width="1.5" filter="url(#sh)"/><text x="363.0" y="95" font-size="9" font-weight="700" fill="#284b52" text-anchor="middle" >Result</text><text x="363.0" y="107" font-size="7" font-weight="500" fill="#8a9aa0" text-anchor="middle" >report</text>
  <g fill="none" stroke="#284b52" stroke-width="1.5" marker-end="url(#ah)">
    <path d="M92 98 H120"/><path d="M198 92 C215 92 215 42 230 42"/><path d="M198 98 H230"/><path d="M198 104 C215 104 215 154 230 154"/>
    <path d="M308 98 H334"/>
  </g>
  <path d="M308 42 C322 42 322 80 322 80 M308 154 C322 154 322 116 322 116" fill="none" stroke="#8a9aa0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="160" cy="70" r="6" fill="#c8a96b"/><text x="160" y="73" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle" >!</text>
  <text x="160" y="170" font-size="8" font-weight="500" fill="#8a9aa0" text-anchor="middle" >plan → act → observe loop</text>

<g transform="translate(160 62)" filter="url(#bs)"><circle r="13" fill="#ffffff" stroke="#b85c38" stroke-width="1.5"/><g fill="none" stroke="#b85c38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#b85c38"><rect x="-6" y="-4" width="12" height="10" rx="2"/><circle cx="-2.5" cy="1" r="1.2" fill="currentColor"/><circle cx="2.5" cy="1" r="1.2" fill="currentColor"/><path d="M0 -4 V-7"/><circle cx="0" cy="-8" r="1" fill="currentColor"/></g></g><g transform="translate(374 28)" filter="url(#bs)"><circle r="13" fill="#ffffff" stroke="#3f6b78" stroke-width="1.5"/><g fill="none" stroke="#3f6b78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#3f6b78"><circle r="4"/><path d="M0 -8 V-5 M0 5 V8 M-8 0 H-5 M5 0 H8 M-5.6 -5.6 L-3.5 -3.5 M3.5 3.5 L5.6 5.6 M5.6 -5.6 L3.5 -3.5 M-3.5 3.5 L-5.6 5.6"/></g></g><g transform="translate(26 28)" filter="url(#bs)"><circle r="13" fill="#ffffff" stroke="#c8a96b" stroke-width="1.5"/><g fill="none" stroke="#c8a96b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#c8a96b"><path d="M1 -8 L-5 1 H0 L-1 8 L5 -1 H0 Z"/></g></g>
</svg>
