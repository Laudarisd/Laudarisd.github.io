<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Manrope, Arial, sans-serif" role="img" aria-label="AI-CE system architecture">
  <rect width="800" height="360" rx="10" fill="#fffdf9"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#284b52"/>
    </marker>
  </defs>
  <!-- client -->
  <rect x="30" y="120" width="170" height="110" rx="10" fill="#f4ead7" stroke="#284b52" stroke-width="2"/>
  <text x="115" y="150" font-size="15" font-weight="700" fill="#284b52" text-anchor="middle">CAD application</text>
  <text x="115" y="172" font-size="13" fill="#3b4a52" text-anchor="middle">AI-CE add-on / UI</text>
  <text x="115" y="206" font-size="11" fill="#5b6670" text-anchor="middle">user input · drawing data · results</text>
  <!-- request / response arrows -->
  <path d="M200 158 H290" stroke="#284b52" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M290 192 H200" stroke="#284b52" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="150" font-size="11" fill="#5b6670" text-anchor="middle">request</text>
  <text x="245" y="212" font-size="11" fill="#5b6670" text-anchor="middle">structured response</text>
  <!-- backend -->
  <rect x="290" y="70" width="240" height="210" rx="10" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <rect x="290" y="70" width="240" height="34" rx="10" fill="#284b52"/>
  <rect x="290" y="90" width="240" height="14" fill="#284b52"/>
  <text x="410" y="93" font-size="15" font-weight="700" fill="#f7f6f2" text-anchor="middle">Backend API (FastAPI)</text>
  <g font-size="13" fill="#3b4a52">
    <rect x="306" y="118" width="208" height="30" rx="6" fill="#f4ead7"/><text x="410" y="138" text-anchor="middle">Validation + preprocessing</text>
    <rect x="306" y="156" width="208" height="30" rx="6" fill="#f4ead7"/><text x="410" y="176" text-anchor="middle">AI inference (YOLO, PyTorch)</text>
    <rect x="306" y="194" width="208" height="30" rx="6" fill="#f4ead7"/><text x="410" y="214" text-anchor="middle">Information extraction</text>
    <rect x="306" y="232" width="208" height="30" rx="6" fill="#f4ead7"/><text x="410" y="252" text-anchor="middle">Result formatting</text>
  </g>
  <!-- data stores -->
  <path d="M530 150 H600" stroke="#284b52" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <g>
    <ellipse cx="660" cy="124" rx="58" ry="12" fill="#f4ead7" stroke="#284b52" stroke-width="2"/>
    <path d="M602 124 V168 A58 12 0 0 0 718 168 V124" fill="#f4ead7" stroke="#284b52" stroke-width="2"/>
    <text x="660" y="156" font-size="14" font-weight="700" fill="#284b52" text-anchor="middle">MySQL</text>
  </g>
  <path d="M530 220 H600" stroke="#284b52" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="602" y="200" width="116" height="40" rx="8" fill="#fffdf9" stroke="#284b52" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="660" y="225" font-size="14" font-weight="700" fill="#284b52" text-anchor="middle">Redis</text>
  <!-- monitoring -->
  <path d="M410 280 V308" stroke="#c8a96b" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="300" y="308" width="104" height="34" rx="8" fill="#fffdf9" stroke="#c8a96b" stroke-width="2"/>
  <text x="352" y="330" font-size="13" font-weight="700" fill="#3b4a52" text-anchor="middle">Prometheus</text>
  <path d="M404 325 H430" stroke="#c8a96b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="432" y="308" width="92" height="34" rx="8" fill="#fffdf9" stroke="#c8a96b" stroke-width="2"/>
  <text x="478" y="330" font-size="13" font-weight="700" fill="#3b4a52" text-anchor="middle">Grafana</text>
  <text x="560" y="330" font-size="11" fill="#5b6670">metrics → dashboards</text>
  <text x="30" y="40" font-size="12" fill="#5b6670">Illustrative diagram · sanitized, no endpoints or internal details</text>
</svg>
