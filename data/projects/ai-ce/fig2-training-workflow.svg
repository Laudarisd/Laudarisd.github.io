<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="Manrope, Arial, sans-serif" role="img" aria-label="Data preparation and training workflow">
  <rect width="800" height="220" rx="10" fill="#fffdf9"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#284b52"/>
    </marker>
  </defs>
  <g font-size="13" fill="#3b4a52" text-anchor="middle">
    <rect x="24" y="70" width="128" height="80" rx="10" fill="#f4ead7" stroke="#284b52" stroke-width="2"/>
    <text x="88" y="104" font-weight="700" fill="#284b52">Raw data</text>
    <text x="88" y="126" font-size="11">drawings · project records</text>

    <rect x="180" y="70" width="128" height="80" rx="10" fill="#f4ead7" stroke="#284b52" stroke-width="2"/>
    <text x="244" y="104" font-weight="700" fill="#284b52">Inspection / EDA</text>
    <text x="244" y="126" font-size="11">format · quality · edge cases</text>

    <rect x="336" y="70" width="128" height="80" rx="10" fill="#f4ead7" stroke="#284b52" stroke-width="2"/>
    <text x="400" y="104" font-weight="700" fill="#284b52">Clean + label</text>
    <text x="400" y="126" font-size="11">OpenCV · annotation</text>

    <rect x="492" y="70" width="128" height="80" rx="10" fill="#f4ead7" stroke="#284b52" stroke-width="2"/>
    <text x="556" y="104" font-weight="700" fill="#284b52">Train + evaluate</text>
    <text x="556" y="126" font-size="11">PyTorch · YOLO · DETR test</text>

    <rect x="648" y="70" width="128" height="80" rx="10" fill="#284b52" stroke="#284b52" stroke-width="2"/>
    <text x="712" y="104" font-weight="700" fill="#f7f6f2">Package + deploy</text>
    <text x="712" y="126" font-size="11" fill="#f7f6f2">served by FastAPI</text>
  </g>
  <g stroke="#284b52" stroke-width="2" marker-end="url(#arrow2)">
    <path d="M152 110 H178"/><path d="M308 110 H334"/><path d="M464 110 H490"/><path d="M620 110 H646"/>
  </g>
  <!-- iteration loop -->
  <path d="M556 150 V184 H244 V152" fill="none" stroke="#c8a96b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <text x="400" y="200" font-size="11" fill="#5b6670" text-anchor="middle">iterate on data and model behaviour</text>
  <text x="24" y="40" font-size="12" fill="#5b6670">Offline development pipeline</text>
</svg>
