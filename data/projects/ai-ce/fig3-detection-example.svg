<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Manrope, Arial, sans-serif" role="img" aria-label="Illustrative detection result on a drawing with extracted information">
  <rect width="800" height="360" rx="10" fill="#fffdf9"/>
  <text x="24" y="34" font-size="12" fill="#5b6670">Illustrative sample · not customer data</text>
  <!-- drawing sheet -->
  <rect x="24" y="50" width="440" height="286" rx="6" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <g fill="none" stroke="#284b52" stroke-width="2.5" stroke-linecap="round">
    <path d="M60 90 H420 V300 H60 Z"/>
    <path d="M60 190 H240 V300"/>
    <path d="M240 90 V190"/>
    <path d="M330 190 H420"/>
    <path d="M240 240 H330"/>
  </g>
  <!-- symbols -->
  <circle cx="150" cy="140" r="14" fill="none" stroke="#284b52" stroke-width="2"/>
  <path d="M150 126 V154 M136 140 H164" stroke="#284b52" stroke-width="2"/>
  <rect x="300" y="120" width="40" height="24" fill="none" stroke="#284b52" stroke-width="2"/>
  <circle cx="370" cy="260" r="14" fill="none" stroke="#284b52" stroke-width="2"/>
  <path d="M100 250 H180" stroke="#284b52" stroke-width="2"/><path d="M100 245 V255 M180 245 V255" stroke="#284b52" stroke-width="2"/>
  <!-- detection boxes -->
  <g fill="none" stroke="#b8761f" stroke-width="2.5">
    <rect x="128" y="118" width="44" height="44" rx="2"/>
    <rect x="292" y="112" width="56" height="40" rx="2"/>
    <rect x="348" y="238" width="44" height="44" rx="2"/>
    <rect x="92" y="236" width="96" height="28" rx="2"/>
  </g>
  <g font-size="10" font-weight="700" fill="#fffdf9">
    <rect x="128" y="104" width="62" height="14" fill="#b8761f"/><text x="132" y="115">symbol A 0.9x</text>
    <rect x="292" y="98" width="62" height="14" fill="#b8761f"/><text x="296" y="109">symbol B 0.8x</text>
    <rect x="348" y="224" width="62" height="14" fill="#b8761f"/><text x="352" y="235">symbol A 0.9x</text>
    <rect x="92" y="222" width="66" height="14" fill="#b8761f"/><text x="96" y="233">dimension 0.9x</text>
  </g>
  <!-- arrow -->
  <path d="M476 190 H514" stroke="#284b52" stroke-width="3" stroke-linecap="round"/>
  <path d="M504 180 L516 190 L504 200" fill="none" stroke="#284b52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- extracted table -->
  <rect x="528" y="70" width="248" height="246" rx="8" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <rect x="528" y="70" width="248" height="34" rx="8" fill="#284b52"/><rect x="528" y="90" width="248" height="14" fill="#284b52"/>
  <text x="652" y="93" font-size="13" font-weight="700" fill="#f7f6f2" text-anchor="middle">Extracted information</text>
  <g font-size="12" fill="#3b4a52">
    <text x="544" y="130" font-weight="700" fill="#284b52">Item</text><text x="680" y="130" font-weight="700" fill="#284b52">Count</text>
    <path d="M544 138 H760" stroke="#d8cec0"/>
    <text x="544" y="162">Symbol A</text><text x="680" y="162">2</text>
    <text x="544" y="190">Symbol B</text><text x="680" y="190">1</text>
    <text x="544" y="218">Dimension text</text><text x="680" y="218">1</text>
    <text x="544" y="246">Rooms (closed polylines)</text><text x="680" y="246">4</text>
    <path d="M544 262 H760" stroke="#d8cec0"/>
    <text x="544" y="290" font-weight="700" fill="#284b52">→ estimation input</text>
  </g>
</svg>
