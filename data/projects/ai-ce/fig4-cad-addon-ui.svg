<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Manrope, Arial, sans-serif" role="img" aria-label="Mock-up of the CAD add-on interface with results">
  <rect width="800" height="400" rx="10" fill="#e9e3d8"/>
  <!-- window chrome -->
  <rect x="20" y="20" width="760" height="360" rx="8" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="32" rx="8" fill="#284b52"/><rect x="20" y="40" width="760" height="12" fill="#284b52"/>
  <circle cx="40" cy="36" r="5" fill="#f7f6f2" opacity="0.6"/><circle cx="56" cy="36" r="5" fill="#f7f6f2" opacity="0.6"/><circle cx="72" cy="36" r="5" fill="#f7f6f2" opacity="0.6"/>
  <text x="400" y="41" font-size="13" font-weight="700" fill="#f7f6f2" text-anchor="middle">CAD application — AI-CE add-on (mock-up)</text>
  <!-- toolbar -->
  <rect x="20" y="52" width="760" height="28" fill="#f4ead7"/>
  <g font-size="11" fill="#3b4a52">
    <text x="36" y="70">File</text><text x="72" y="70">Edit</text><text x="108" y="70">View</text><text x="150" y="70">Draw</text>
    <rect x="200" y="57" width="64" height="18" rx="4" fill="#284b52"/><text x="232" y="70" fill="#f7f6f2" font-weight="700" text-anchor="middle">AI-CE</text>
  </g>
  <!-- drawing canvas -->
  <rect x="20" y="80" width="520" height="300" fill="#fbf8f2"/>
  <g fill="none" stroke="#284b52" stroke-width="2">
    <path d="M70 120 H470 V340 H70 Z"/><path d="M70 230 H270 V340"/><path d="M270 120 V230"/><path d="M370 230 H470"/>
  </g>
  <g fill="none" stroke="#b8761f" stroke-width="2">
    <rect x="150" y="150" width="40" height="40"/><rect x="330" y="150" width="50" height="34"/><rect x="390" y="270" width="40" height="40"/>
  </g>
  <!-- side panel -->
  <rect x="540" y="80" width="240" height="300" fill="#fffdf9" stroke="#d8cec0"/>
  <text x="556" y="106" font-size="13" font-weight="700" fill="#284b52">AI-CE results</text>
  <rect x="556" y="118" width="208" height="26" rx="5" fill="#284b52"/>
  <text x="660" y="135" font-size="12" font-weight="700" fill="#f7f6f2" text-anchor="middle">Analyse current drawing</text>
  <g font-size="11" fill="#3b4a52">
    <text x="556" y="168" font-weight="700" fill="#5b6670">Status</text><text x="700" y="168" fill="#284b52" font-weight="700">done</text>
    <path d="M556 176 H764" stroke="#d8cec0"/>
    <text x="556" y="198">Symbol A</text><text x="740" y="198" text-anchor="end">2</text>
    <text x="556" y="220">Symbol B</text><text x="740" y="220" text-anchor="end">1</text>
    <text x="556" y="242">Dimension text</text><text x="740" y="242" text-anchor="end">1</text>
    <text x="556" y="264">Rooms</text><text x="740" y="264" text-anchor="end">4</text>
    <path d="M556 276 H764" stroke="#d8cec0"/>
    <text x="556" y="298" font-weight="700" fill="#284b52">Estimate items</text><text x="740" y="298" text-anchor="end" font-weight="700" fill="#284b52">8</text>
  </g>
  <rect x="556" y="320" width="100" height="24" rx="5" fill="#fffdf9" stroke="#284b52"/>
  <text x="606" y="336" font-size="11" fill="#284b52" text-anchor="middle">Apply to drawing</text>
  <rect x="664" y="320" width="100" height="24" rx="5" fill="#fffdf9" stroke="#284b52"/>
  <text x="714" y="336" font-size="11" fill="#284b52" text-anchor="middle">Export</text>
</svg>
