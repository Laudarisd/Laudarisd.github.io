<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="CAD drawing turned into a cost estimate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#e8d8ba"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- drawing sheet -->
  <rect x="34" y="36" width="140" height="128" rx="6" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <g fill="none" stroke="#284b52" stroke-width="2.5" stroke-linecap="round">
    <path d="M54 60 H154 V132 H54 Z"/>
    <path d="M54 96 H104 V132"/>
    <path d="M104 60 V96"/>
    <path d="M128 96 H154"/>
  </g>
  <!-- dimension line -->
  <path d="M54 146 H154" stroke="#c8a96b" stroke-width="2"/>
  <path d="M54 141 V151 M154 141 V151" stroke="#c8a96b" stroke-width="2"/>
  <!-- arrow -->
  <path d="M188 100 H226" stroke="#284b52" stroke-width="4" stroke-linecap="round"/>
  <path d="M214 88 L228 100 L214 112" fill="none" stroke="#284b52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- estimate table -->
  <rect x="244" y="36" width="122" height="128" rx="6" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <rect x="244" y="36" width="122" height="24" rx="6" fill="#284b52"/>
  <rect x="244" y="50" width="122" height="10" fill="#284b52"/>
  <text x="305" y="53" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#f7f6f2" text-anchor="middle">COST ESTIMATE</text>
  <g stroke="#284b52" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <path d="M256 78 H300"/><path d="M256 96 H292"/><path d="M256 114 H304"/>
  </g>
  <g fill="#c8a96b">
    <rect x="322" y="72" width="32" height="10" rx="2"/>
    <rect x="330" y="90" width="24" height="10" rx="2"/>
    <rect x="316" y="108" width="38" height="10" rx="2"/>
  </g>
  <path d="M256 132 H354" stroke="#284b52" stroke-width="2"/>
  <text x="256" y="152" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#284b52">TOTAL</text>
  <rect x="312" y="141" width="42" height="12" rx="2" fill="#284b52"/>
</svg>
