<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="Manrope, Arial, sans-serif" role="img" aria-label="Chat interface with a prompt and a generated image">
  <rect width="400" height="200" fill="url(#ground)"/>
<defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e3fa"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#284b52" flood-opacity="0.16"/></filter>
    <filter id="bs" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#284b52" flood-opacity="0.22"/></filter>
  </defs>

  <rect x="24" y="14" width="352" height="172" rx="10" fill="#f7f9f9" stroke="#dfe6e8" filter="url(#sh)"/>
  <rect x="40" y="30" width="200" height="34" rx="12" fill="#e9e3fa"/><text x="52" y="44" font-size="8" font-weight="500" fill="#284b52" text-anchor="start" >Describe a coastal city at dawn,</text><text x="52" y="56" font-size="8" font-weight="500" fill="#284b52" text-anchor="start" >then generate a poster image.</text>
  <circle cx="28" cy="48" r="0" fill="none"/>
  <rect x="150" y="76" width="210" height="96" rx="12" fill="#ffffff" stroke="#7c5cd6" stroke-width="1.2" filter="url(#sh)"/>
  <defs><linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d9b1"/><stop offset="0.6" stop-color="#e0a978"/><stop offset="1" stop-color="#7c5cd6"/></linearGradient></defs>
  <rect x="160" y="86" width="90" height="76" rx="6" fill="url(#dawn)"/>
  <circle cx="190" cy="118" r="10" fill="#fff1d6"/><path d="M160 162 L160 140 L176 126 L190 140 L204 122 L222 142 L236 134 L250 146 V162 Z" fill="#2e4e58"/>
  <rect x="168" y="134" width="4" height="28" fill="#1f2933"/><rect x="180" y="142" width="4" height="20" fill="#1f2933"/><rect x="196" y="130" width="4" height="32" fill="#1f2933"/><rect x="212" y="140" width="4" height="22" fill="#1f2933"/><rect x="228" y="136" width="4" height="26" fill="#1f2933"/>
  <rect x="260" y="92" width="90" height="4" rx="1.5" fill="#6b7d84"/>
<rect x="260" y="102" width="84" height="4" rx="1.5" fill="#6b7d84"/>
<rect x="260" y="112" width="90" height="4" rx="1.5" fill="#6b7d84"/>
<rect x="260" y="122" width="60" height="4" rx="1.5" fill="#6b7d84"/>
  <path d="M260 140 L266 128 L272 140 L284 146 L272 152 L266 164 L260 152 L248 146 Z" fill="#e8a317"/>
  <text x="300" y="162" font-size="7" font-weight="500" fill="#8a9aa0" text-anchor="middle" >image · text</text>
  <rect x="40" y="150" width="90" height="16" rx="8" fill="#ffffff" stroke="#dfe6e8" filter="url(#sh)"/><text x="85" y="161" font-size="7" font-weight="500" fill="#8a9aa0" text-anchor="middle" >typing…</text>

<g transform="translate(40 104)" filter="url(#bs)"><circle r="13" fill="#ffffff" stroke="#b85c38" stroke-width="1.5"/><g fill="none" stroke="#b85c38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#b85c38"><rect x="-6" y="-4" width="12" height="10" rx="2"/><circle cx="-2.5" cy="1" r="1.2" fill="currentColor"/><circle cx="2.5" cy="1" r="1.2" fill="currentColor"/><path d="M0 -4 V-7"/><circle cx="0" cy="-8" r="1" fill="currentColor"/></g></g><g transform="translate(376 24)" filter="url(#bs)"><circle r="13" fill="#ffffff" stroke="#c8a96b" stroke-width="1.5"/><g fill="none" stroke="#c8a96b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#c8a96b"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/></g></g><g transform="translate(24 178)" filter="url(#bs)"><circle r="13" fill="#ffffff" stroke="#3f6b78" stroke-width="1.5"/><g fill="none" stroke="#3f6b78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#3f6b78"><rect x="-5" y="-5" width="10" height="10" rx="1.5"/><path d="M-2 -5 V-8 M2 -5 V-8 M-2 5 V8 M2 5 V8 M-5 -2 H-8 M-5 2 H-8 M5 -2 H8 M5 2 H8"/></g></g>
