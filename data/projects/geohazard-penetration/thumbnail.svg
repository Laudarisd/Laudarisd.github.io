<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Soil layers with a penetration probe and a prediction curve">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#e8d8ba"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- ground surface -->
  <path d="M30 70 Q80 60 130 70 T230 70" fill="none" stroke="#284b52" stroke-width="3" stroke-linecap="round"/>
  <!-- soil layers -->
  <path d="M30 70 Q80 60 130 70 T230 70 V104 H30 Z" fill="#e3d3b4"/>
  <path d="M30 104 H230 V136 H30 Z" fill="#d3bd94"/>
  <path d="M30 136 H230 V172 H30 Z" fill="#bca27a"/>
  <g stroke="#284b52" stroke-width="1" opacity="0.35">
    <path d="M30 104 H230"/><path d="M30 136 H230"/>
  </g>
  <!-- pebbles in the bottom layer -->
  <g fill="#284b52" opacity="0.35">
    <circle cx="60" cy="154" r="3"/><circle cx="110" cy="160" r="2.5"/><circle cx="180" cy="150" r="3"/><circle cx="210" cy="164" r="2"/>
  </g>
  <!-- penetration probe -->
  <rect x="124" y="30" width="12" height="100" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <path d="M124 130 L130 150 L136 130 Z" fill="#c8a96b" stroke="#284b52" stroke-width="2"/>
  <rect x="112" y="26" width="36" height="12" rx="3" fill="#284b52"/>
  <!-- warning badge -->
  <path d="M70 136 L84 112 L98 136 Z" fill="#c8a96b" stroke="#284b52" stroke-width="2" stroke-linejoin="round"/>
  <path d="M84 120 V128" stroke="#284b52" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="84" cy="132" r="1.5" fill="#284b52"/>
  <!-- prediction chart -->
  <rect x="250" y="40" width="120" height="120" rx="6" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <path d="M264 148 V54 M264 148 H356" stroke="#284b52" stroke-width="2" stroke-linecap="round"/>
  <path d="M264 140 C290 132 300 100 316 90 S344 70 356 62" fill="none" stroke="#284b52" stroke-width="3" stroke-linecap="round"/>
  <path d="M264 142 C292 138 304 108 318 98 S346 80 356 74" fill="none" stroke="#c8a96b" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
  <g fill="#c8a96b" stroke="#284b52" stroke-width="1.5">
    <circle cx="290" cy="128" r="4"/><circle cx="316" cy="92" r="4"/><circle cx="340" cy="72" r="4"/>
  </g>
</svg>
