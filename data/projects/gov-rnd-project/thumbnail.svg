  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- certificate document -->
  <rect x="48" y="30" width="170" height="140" rx="6" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <rect x="58" y="40" width="150" height="120" fill="none" stroke="#c8a96b" stroke-width="1.5" stroke-dasharray="3 3"/>
