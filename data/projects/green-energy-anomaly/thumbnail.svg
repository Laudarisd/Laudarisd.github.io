<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Wind turbine and solar panel with an anomaly on a time-series chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#e8d8ba"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- ground line -->
  <path d="M30 160 H370" stroke="#284b52" stroke-width="2" opacity="0.4"/>
  <!-- wind turbine -->
  <path d="M90 160 L96 74 H100 L106 160 Z" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <circle cx="98" cy="72" r="6" fill="#284b52"/>
  <g fill="#fffdf9" stroke="#284b52" stroke-width="2.5" stroke-linejoin="round">
    <path d="M98 72 L104 22 L92 24 Z"/>
    <path d="M98 72 L142 94 L136 104 Z"/>
    <path d="M98 72 L54 96 L60 106 Z"/>
  </g>
  <!-- solar panel -->
  <path d="M138 160 L148 124 H206 L196 160 Z" fill="#284b52"/>
  <g stroke="#f7f6f2" stroke-width="1.5" opacity="0.8">
    <path d="M143 142 H201"/><path d="M162 124 L156 160"/><path d="M182 124 L176 160"/>
  </g>
  <!-- chart card -->
  <rect x="226" y="40" width="144" height="110" rx="6" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <g stroke="#284b52" stroke-width="1" opacity="0.25">
    <path d="M240 70 H356"/><path d="M240 96 H356"/><path d="M240 122 H356"/>
  </g>
  <path d="M240 120 L256 110 L270 116 L284 104 L298 108 L308 62 L318 112 L332 100 L346 104 L356 94" fill="none" stroke="#284b52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- anomaly marker -->
  <circle cx="308" cy="62" r="8" fill="#c8a96b" stroke="#284b52" stroke-width="2"/>
  <path d="M308 44 V48" stroke="#284b52" stroke-width="3" stroke-linecap="round"/>
  <circle cx="308" cy="53" r="1.8" fill="#284b52"/>
</svg>
