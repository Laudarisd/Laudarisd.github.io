<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="PDF page converted into a CAD drawing with text">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#e8d8ba"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- PDF page with folded corner -->
  <path d="M50 30 H140 L166 56 V170 H50 Z" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <path d="M140 30 V56 H166" fill="#efe6d4" stroke="#284b52" stroke-width="2"/>
  <rect x="50" y="128" width="54" height="22" rx="3" fill="#284b52"/>
  <text x="77" y="144" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="800" fill="#f7f6f2" text-anchor="middle">PDF</text>
  <g stroke="#284b52" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <path d="M66 74 H146"/><path d="M66 90 H134"/><path d="M66 106 H146"/>
  </g>
  <!-- arrow -->
  <path d="M184 100 H222" stroke="#284b52" stroke-width="4" stroke-linecap="round"/>
  <path d="M210 88 L224 100 L210 112" fill="none" stroke="#284b52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- CAD sheet -->
  <rect x="240" y="30" width="120" height="140" rx="6" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <g fill="none" stroke="#284b52" stroke-width="2.5" stroke-linecap="round">
    <path d="M256 50 H344 V110 H256 Z"/>
    <path d="M300 50 V110"/>
    <path d="M256 80 H300"/>
  </g>
  <!-- extracted text on drawing -->
  <text x="300" y="146" font-family="Spectral, Georgia, serif" font-size="26" font-weight="700" fill="#c8a96b" text-anchor="middle">Aa</text>
  <path d="M258 158 H342" stroke="#c8a96b" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
