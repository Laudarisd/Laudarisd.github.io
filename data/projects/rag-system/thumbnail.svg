<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Documents retrieved to answer a question">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#e8d8ba"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- stacked documents -->
  <g stroke="#284b52" stroke-width="2">
    <rect x="66" y="52" width="80" height="104" rx="5" fill="#efe6d4"/>
    <rect x="54" y="42" width="80" height="104" rx="5" fill="#f7f1e4"/>
    <rect x="42" y="32" width="80" height="104" rx="5" fill="#fffdf9"/>
  </g>
  <g stroke="#284b52" stroke-width="3" stroke-linecap="round" opacity="0.65">
    <path d="M56 54 H108"/><path d="M56 68 H104"/><path d="M56 82 H108"/><path d="M56 96 H92"/>
  </g>
  <!-- highlighted passage -->
  <rect x="52" y="106" width="60" height="12" rx="3" fill="#c8a96b" opacity="0.6"/>
  <!-- retrieval arrow -->
  <path d="M160 96 H214" stroke="#284b52" stroke-width="4" stroke-linecap="round"/>
  <path d="M202 84 L216 96 L202 108" fill="none" stroke="#284b52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- small magnifier on the arrow -->
  <circle cx="186" cy="68" r="12" fill="#fffdf9" stroke="#c8a96b" stroke-width="3"/>
  <path d="M195 77 L206 88" stroke="#c8a96b" stroke-width="4" stroke-linecap="round"/>
  <!-- answer bubble -->
  <path d="M236 44 H352 Q364 44 364 56 V120 Q364 132 352 132 H276 L252 154 V132 H236 Q224 132 224 120 V56 Q224 44 236 44 Z" fill="#284b52"/>
  <g stroke="#f7f6f2" stroke-width="4" stroke-linecap="round">
    <path d="M244 68 H340"/><path d="M244 86 H326"/><path d="M244 104 H300"/>
  </g>
  <circle cx="336" cy="104" r="6" fill="#c8a96b"/>
</svg>
