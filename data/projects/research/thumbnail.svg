<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="Manrope, Arial, sans-serif" role="img" aria-label="Accuracy versus pruning ratio with a pruned network inset">
  <rect width="400" height="200" fill="url(#ground)"/>
