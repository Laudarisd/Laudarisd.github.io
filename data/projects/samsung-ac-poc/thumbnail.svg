<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Air conditioner unit on an engineering drawing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#e8d8ba"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- drawing sheet -->
  <rect x="40" y="26" width="320" height="148" rx="6" fill="#fffdf9" stroke="#284b52" stroke-width="2"/>
  <!-- outdoor unit body -->
  <rect x="96" y="56" width="150" height="96" rx="6" fill="#f0e7d6" stroke="#284b52" stroke-width="3"/>
  <!-- fan -->
  <circle cx="146" cy="104" r="32" fill="#fffdf9" stroke="#284b52" stroke-width="3"/>
  <g fill="none" stroke="#284b52" stroke-width="3" stroke-linecap="round">
    <path d="M146 104 Q156 82 170 90"/>
    <path d="M146 104 Q166 116 156 130"/>
    <path d="M146 104 Q124 112 122 92"/>
  </g>
  <circle cx="146" cy="104" r="5" fill="#284b52"/>
  <!-- grille lines -->
  <g stroke="#284b52" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M196 72 H232"/><path d="M196 86 H232"/><path d="M196 100 H232"/><path d="M196 114 H232"/><path d="M196 128 H232"/>
  </g>
  <!-- airflow -->
  <g fill="none" stroke="#c8a96b" stroke-width="3" stroke-linecap="round">
    <path d="M258 80 q10 -6 20 0 t20 0"/>
    <path d="M258 104 q10 -6 20 0 t20 0"/>
    <path d="M258 128 q10 -6 20 0 t20 0"/>
  </g>
  <!-- dimension lines -->
  <path d="M96 164 H246" stroke="#284b52" stroke-width="1.5"/>
  <path d="M96 159 V169 M246 159 V169" stroke="#284b52" stroke-width="1.5"/>
  <path d="M76 56 V152" stroke="#284b52" stroke-width="1.5"/>
  <path d="M71 56 H81 M71 152 H81" stroke="#284b52" stroke-width="1.5"/>
  <text x="330" y="160" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#284b52" text-anchor="middle">A/C UNIT</text>
</svg>
