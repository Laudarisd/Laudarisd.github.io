<!DOCTYPE html>
<html lang="en" data-theme="simple">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sudip Laudari: Researcher</title>
    <meta
      name="description"
      content="Academic portfolio for research, teaching, publications, and projects."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Spectral:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=20261105" />
    <link rel="stylesheet" href="hero/hero.css?v=20261105" />
    <link rel="stylesheet" href="experience/experience.css?v=20261105" />
    <link rel="stylesheet" href="skills/skills.css?v=20261105" />
    <link rel="stylesheet" href="projects/projects.css?v=20261105" />
  </head>
  <body>
    <!--
      Every section lives in its own folder (hero/, experience/, skills/, education/,
      projects/, publications/, patents/, contact/): the markup fragment, the script
      holding its content and renderer, and its styles. js/site.js loads them all.
      Edit those files to add or change content; the markup below is only the layout.
    -->
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" id="brand" href="#top">Sudip Laudari</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="#resume" data-ui="nav.about">About</a>
          <a href="#projects" data-ui="nav.projects">Projects</a>
          <a href="#contact" data-ui="nav.contact">Contact</a>
          <a href="https://github.com/Laudarisd" target="_blank" rel="noopener noreferrer" data-ui="nav.github">GitHub</a>
        </nav>
        <div class="lang-switcher" role="group" aria-label="Language">
          <button
            class="lang-toggle is-active"
            type="button"
            data-lang="en"
            lang="en"
            aria-pressed="true"
          >
            EN
          </button>
          <button
            class="lang-toggle"
            type="button"
            data-lang="kr"
            lang="ko"
            aria-pressed="false"
          >
            한국어
          </button>
        </div>
      </div>
    </header>
    <div class="theme-switcher-shell">
      <div class="theme-switcher" aria-label="Color modes">
        <button
          class="theme-toggle theme-toggle-dark"
          type="button"
          data-theme-target="dark"
          data-theme-label="Midnight Archive"
          aria-label="Switch to Midnight Archive theme"
          title="Midnight Archive"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
        <button
          class="theme-toggle theme-toggle-light-vintage"
          type="button"
          data-theme-target="light-vintage"
          data-theme-label="Paper Study"
          aria-label="Switch to Paper Study theme"
          title="Paper Study"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
        <button
          class="theme-toggle theme-toggle-pure-vintage"
          type="button"
          data-theme-target="pure-vintage"
          data-theme-label="Sepia Ledger"
          aria-label="Switch to Sepia Ledger theme"
          title="Sepia Ledger"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
        <button
          class="theme-toggle theme-toggle-simple is-active"
          type="button"
          data-theme-target="simple"
          data-theme-label="Clean Draft"
          aria-label="Switch to Clean Draft theme"
          title="Clean Draft"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <main id="top">
      <div data-include="hero/hero.html"></div>

      <!-- Experience, skills, and education -->
      <section id="resume" class="section section-muted">
        <div class="container">
          <div class="section-heading">
            <h2 data-ui="sections.experience_skills_education"></h2>
          </div>
          <div class="resume-overview-grid">
            <div data-include="experience/experience.html"></div>

            <div data-include="skills/skills.html"></div>

            <div data-include="education/degrees.html"></div>
          </div>
        </div>
      </section>

      <!-- Projects -->
      <section id="projects" class="section">
        <div class="container">
          <div class="section-heading">
            <h2 data-ui="sections.projects"></h2>
          </div>

          <div data-include="projects/projects.html"></div>
        </div>
      </section>

      <!-- Publications, patent applications, and scholarships -->
      <section class="section publication-records-section">
        <div class="container">
          <div class="section-heading">
            <h2 data-ui="sections.publications_patents_scholarships"></h2>
          </div>

          <div class="publication-records-grid">
            <div data-include="publications/publications.html"></div>

            <div data-include="patents/patents.html"></div>

            <div data-include="education/honours.html"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Contact -->
    <footer id="contact" class="site-footer">
      <div data-include="contact/contact.html"></div>
    </footer>

    <script>
      (function () {
        var root = document.documentElement;
        var toggles = document.querySelectorAll(".theme-toggle");
        var storageKey = "portfolio-theme-v2";
        var defaultTheme = "simple";
        var savedTheme = localStorage.getItem(storageKey) || defaultTheme;

        function applyTheme(theme) {
          root.setAttribute("data-theme", theme);

          toggles.forEach(function (toggle) {
            var isActive = toggle.getAttribute("data-theme-target") === theme;
            toggle.classList.toggle("is-active", isActive);
            toggle.setAttribute("aria-pressed", isActive ? "true" : "false");
          });
        }

        applyTheme(savedTheme);

        toggles.forEach(function (toggle) {
          toggle.addEventListener("click", function () {
            var theme = toggle.getAttribute("data-theme-target");
            localStorage.setItem(storageKey, theme);
            applyTheme(theme);
          });
        });
      })();
    </script>
    <script src="js/site.js?v=20261105"></script>
  </body>
</html>
