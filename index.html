<!DOCTYPE html>
<html lang="en" data-theme="light-vintage">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sudip Laudari: Researcher</title>
    <meta
      name="description"
      content="Academic portfolio for research, teaching, publications, and projects."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Spectral:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!--
      All text content on this page is loaded from the JSON files in /data
      (one file per section, per language: *_en.json and *_kr.json).
      Edit those files to add or change content; the markup below is only the layout.
    -->
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" id="brand" href="#top">Sudip Laudari</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="#resume" data-ui="nav.about">About</a>
          <a href="#projects" data-ui="nav.projects">Projects</a>
          <a href="#contact" data-ui="nav.contact">Contact</a>
        </nav>
        <div class="lang-switcher" role="group" aria-label="Language">
          <button
            class="lang-toggle is-active"
            type="button"
            data-lang="en"
            lang="en"
            aria-pressed="true"
          >
            EN
          </button>
          <button
            class="lang-toggle"
            type="button"
            data-lang="kr"
            lang="ko"
            aria-pressed="false"
          >
            한국어
          </button>
        </div>
      </div>
    </header>
    <div class="theme-switcher-shell">
      <div class="theme-switcher" aria-label="Color modes">
        <button
          class="theme-toggle theme-toggle-dark"
          type="button"
          data-theme-target="dark"
          data-theme-label="Midnight Archive"
          aria-label="Switch to Midnight Archive theme"
          title="Midnight Archive"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
        <button
          class="theme-toggle theme-toggle-light-vintage is-active"
          type="button"
          data-theme-target="light-vintage"
          data-theme-label="Paper Study"
          aria-label="Switch to Paper Study theme"
          title="Paper Study"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
        <button
          class="theme-toggle theme-toggle-pure-vintage"
          type="button"
          data-theme-target="pure-vintage"
          data-theme-label="Sepia Ledger"
          aria-label="Switch to Sepia Ledger theme"
          title="Sepia Ledger"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
        <button
          class="theme-toggle theme-toggle-simple"
          type="button"
          data-theme-target="simple"
          data-theme-label="Clean Draft"
          aria-label="Switch to Clean Draft theme"
          title="Clean Draft"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <main id="top">
      <!-- Hero: data/hero_*.json -->
      <section class="hero">
        <div class="container hero-grid">
          <div class="hero-copy">
            <h1 id="hero-title"></h1>
            <p class="hero-text" id="hero-text"></p>
            <div class="hero-actions" id="hero-actions"></div>
            <ul class="hero-highlights" id="hero-highlights"></ul>
          </div>
          <aside class="hero-photo-card">
            <img
              src="img/github-profile.png"
              alt="Sudip Laudari"
              class="hero-photo"
              id="hero-photo"
            />
          </aside>
        </div>
      </section>

      <!-- Academic foundation: data/education_*.json -->
      <section id="resume" class="section">
        <div class="container">
          <div class="section-heading">
            <h2 class="section-title-compact" data-ui="sections.academic"></h2>
          </div>

          <div class="summary-grid">
            <article class="panel">
              <h2 data-ui="sections.degrees"></h2>
              <ul class="record-list" id="degrees-list"></ul>
            </article>

            <article class="panel">
              <h2 data-ui="sections.honours"></h2>
              <ul class="record-list" id="honours-list"></ul>
            </article>
          </div>
        </div>
      </section>

      <!-- Experience & skills: data/experience_*.json, data/skills_*.json -->
      <section class="section section-muted">
        <div class="container">
          <div class="section-heading">
            <h2 data-ui="sections.experience_skills"></h2>
          </div>
          <div class="experience-skills-grid">
            <article class="panel experience-panel">
              <h2>
                <span data-ui="sections.experience"></span>
                <span class="heading-note" id="experience-note"></span>
              </h2>
              <div id="experience-list"></div>
            </article>

            <article class="panel skills-panel">
              <h2 data-ui="sections.skills"></h2>
              <div class="skill-sections" id="skills-list"></div>
            </article>
          </div>
        </div>
      </section>

      <!-- Publications & patents: data/publications_*.json, data/patents_*.json -->
      <section class="section section-muted">
        <div class="container">
          <div class="section-heading">
            <h2 data-ui="sections.publications_patents"></h2>
          </div>

          <div class="details-grid">
            <article class="panel records-panel">
              <h1 data-ui="sections.publications"></h1>
              <ul class="record-list" id="publications-list"></ul>
            </article>

            <article class="panel records-panel">
              <h1 data-ui="sections.patents"></h1>
              <ul class="record-list" id="patents-list"></ul>
            </article>
          </div>
        </div>
      </section>

      <!-- Projects: data/projects_*.json -->
      <section id="projects" class="section">
        <div class="container">
          <div class="section-heading">
            <h2 data-ui="sections.projects"></h2>
          </div>

          <div class="project-grid" id="project-grid"></div>

          <p class="projects-note" id="projects-note"></p>
        </div>
      </section>
    </main>

    <!-- Contact: data/contact_*.json -->
    <footer id="contact" class="site-footer">
      <div class="container footer-shell">
        <div>
          <h2 id="contact-heading"></h2>
        </div>
        <div class="footer-links" id="contact-links"></div>
      </div>
    </footer>

    <script>
      (function () {
        var root = document.documentElement;
        var toggles = document.querySelectorAll(".theme-toggle");
        var storageKey = "portfolio-theme";
        var defaultTheme = "light-vintage";
        var savedTheme = localStorage.getItem(storageKey) || defaultTheme;

        function applyTheme(theme) {
          root.setAttribute("data-theme", theme);

          toggles.forEach(function (toggle) {
            var isActive = toggle.getAttribute("data-theme-target") === theme;
            toggle.classList.toggle("is-active", isActive);
            toggle.setAttribute("aria-pressed", isActive ? "true" : "false");
          });
        }

        applyTheme(savedTheme);

        toggles.forEach(function (toggle) {
          toggle.addEventListener("click", function () {
            var theme = toggle.getAttribute("data-theme-target");
            localStorage.setItem(storageKey, theme);
            applyTheme(theme);
          });
        });
      })();
    </script>
    <script src="js/site.js"></script>
  </body>
</html>
