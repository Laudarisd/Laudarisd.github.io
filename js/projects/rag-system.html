<!DOCTYPE html>
<html lang="en" data-theme="light-vintage">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG System | Sudip Laudari</title>
    <meta name="description" content="Project detail page from the portfolio of Sudip Laudari." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Spectral:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <!--
      Project detail page. This file is only the layout: all text comes from
      data/projects/rag-system/<lang>.json and data/ui/<lang>.json,
      rendered by js/project.js. To add a page, copy this file and change
      the <title> and the data-project attribute on <main>.
    -->
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" id="brand" href="../../index.html">Sudip Laudari</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="../../index.html#resume" data-ui="nav.about">About</a>
          <a href="../../index.html#projects" data-ui="nav.projects">Projects</a>
          <a href="../../index.html#contact" data-ui="nav.contact">Contact</a>
        </nav>
        <div class="lang-switcher" role="group" aria-label="Language">
          <button class="lang-toggle is-active" type="button" data-lang="en" lang="en" aria-pressed="true">
            EN
          </button>
          <button class="lang-toggle" type="button" data-lang="kr" lang="ko" aria-pressed="false">
            한국어
          </button>
        </div>
      </div>
    </header>
    <div class="theme-switcher-shell">
      <div class="theme-switcher" aria-label="Color modes">
        <button
          class="theme-toggle theme-toggle-dark"
          type="button"
          data-theme-target="dark"
          data-theme-label="Midnight Archive"
          aria-label="Switch to Midnight Archive theme"
          title="Midnight Archive"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
        <button
          class="theme-toggle theme-toggle-light-vintage is-active"
          type="button"
          data-theme-target="light-vintage"
          data-theme-label="Paper Study"
          aria-label="Switch to Paper Study theme"
          title="Paper Study"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
        <button
          class="theme-toggle theme-toggle-pure-vintage"
          type="button"
          data-theme-target="pure-vintage"
          data-theme-label="Sepia Ledger"
          aria-label="Switch to Sepia Ledger theme"
          title="Sepia Ledger"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
        <button
          class="theme-toggle theme-toggle-simple"
          type="button"
          data-theme-target="simple"
          data-theme-label="Clean Draft"
          aria-label="Switch to Clean Draft theme"
          title="Clean Draft"
        >
          <span class="theme-swatch" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <main id="top" data-project="rag-system">
      <!-- Title block: filled from the project entry -->
      <section class="project-detail-hero">
        <div class="container">
          <a class="back-link" href="../../index.html#projects" data-ui="project_page.back">Back to projects</a>
          <h1 id="detail-title"></h1>
          <p class="hero-text" id="detail-subtitle"></p>
          <div class="project-meta" id="detail-meta"></div>
          <ul class="project-tags" id="detail-tags"></ul>
        </div>
      </section>

      <!-- Detail panels: each one is hidden automatically when the entry has no content for it -->
      <section class="section">
        <div class="container detail-grid">
          <article class="panel detail-panel detail-panel-wide" id="panel-overview">
            <h2 data-ui="project_page.overview"></h2>
            <div class="panel-body"></div>
          </article>
          <article class="panel detail-panel" id="panel-problem">
            <h2 data-ui="project_page.problem"></h2>
            <div class="panel-body"></div>
          </article>
          <article class="panel detail-panel" id="panel-contributions">
            <h2 data-ui="project_page.contributions"></h2>
            <div class="panel-body"></div>
          </article>
          <article class="panel detail-panel detail-panel-wide" id="panel-architecture">
            <h2 data-ui="project_page.architecture"></h2>
            <div class="panel-body"></div>
          </article>
          <article class="panel detail-panel detail-panel-wide" id="panel-process">
            <h2 data-ui="project_page.process"></h2>
            <div class="panel-body"></div>
          </article>
          <article class="panel detail-panel" id="panel-pipeline">
            <h2 data-ui="project_page.pipeline"></h2>
            <div class="panel-body"></div>
          </article>
          <article class="panel detail-panel" id="panel-stack">
            <h2 data-ui="project_page.stack"></h2>
            <div class="panel-body"></div>
          </article>
          <article class="panel detail-panel detail-panel-wide" id="panel-components">
            <h2 data-ui="project_page.components"></h2>
            <div class="panel-body"></div>
          </article>
          <article class="panel detail-panel detail-panel-wide" id="panel-figures">
            <h2 data-ui="project_page.figures"></h2>
            <div class="panel-body"></div>
          </article>
          <article class="panel detail-panel detail-panel-wide" id="panel-results">
            <h2 data-ui="project_page.results"></h2>
            <div class="panel-body"></div>
          </article>
          <article class="panel detail-panel detail-panel-wide" id="panel-links">
            <h2 data-ui="project_page.links"></h2>
            <div class="panel-body"></div>
          </article>
        </div>
      </section>
    </main>

    <!-- Contact: data/contact_*.json (same footer as the main page) -->
    <footer id="contact" class="site-footer">
      <div class="container footer-shell">
        <div>
          <h2 id="contact-heading"></h2>
        </div>
        <div class="footer-links" id="contact-links"></div>
      </div>
    </footer>

    <script>
      // Theme switcher: identical to index.html so the chosen theme carries over.
      (function () {
        var root = document.documentElement;
        var toggles = document.querySelectorAll(".theme-toggle");
        var storageKey = "portfolio-theme";
        var defaultTheme = "light-vintage";
        var savedTheme = localStorage.getItem(storageKey) || defaultTheme;

        function applyTheme(theme) {
          root.setAttribute("data-theme", theme);

          toggles.forEach(function (toggle) {
            var isActive = toggle.getAttribute("data-theme-target") === theme;
            toggle.classList.toggle("is-active", isActive);
            toggle.setAttribute("aria-pressed", isActive ? "true" : "false");
          });
        }

        applyTheme(savedTheme);

        toggles.forEach(function (toggle) {
          toggle.addEventListener("click", function () {
            var theme = toggle.getAttribute("data-theme-target");
            localStorage.setItem(storageKey, theme);
            applyTheme(theme);
          });
        });
      })();
    </script>
    <script src="../project.js"></script>
  </body>
</html>
